{% extends "base.html" %}
{% block title %}Dashboard — JobTracker{% endblock %}
{% block content %}
<div class="mb-6">
  <div class="flex items-center justify-between flex-wrap gap-4">
    <div>
      <h1 class="text-2xl font-bold">Jobs Dashboard</h1>
      <p class="text-sm text-slate-500">Remote and onsite roles from RemoteOK, WeWorkRemotely, Arbeitnow, and Hacker News "Who is hiring".</p>
    </div>
    <button id="scrape-btn"
      class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold px-4 py-2 rounded-md shadow-sm disabled:opacity-60">
      Scrape Now
    </button>
  </div>
</div>

<div class="bg-white p-4 rounded-lg shadow-sm mb-6 grid grid-cols-1 sm:grid-cols-5 gap-3">
  <input id="filter-q"       type="text"   placeholder="Search title / description…"
         class="border rounded-md px-3 py-2 sm:col-span-2 focus:outline-none focus:ring-2 focus:ring-indigo-400" />
  <input id="filter-company" type="text"   placeholder="Company contains…"
         class="border rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-400" />
  <select id="filter-remote" class="border rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-400">
    <option value="">All jobs</option>
    <option value="remote">Remote only</option>
    <option value="onsite">Onsite only</option>
    <option value="hybrid">Hybrid only</option>
  </select>
  <select id="filter-days" class="border rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-400">
    <option value="">Any date</option>
    <option value="1">Last 24h</option>
    <option value="3">Last 3 days</option>
    <option value="7">Last 7 days</option>
    <option value="14">Last 14 days</option>
    <option value="30">Last 30 days</option>
  </select>
</div>

<div id="jobs-meta" class="text-xs text-slate-500 mb-2"></div>
<div id="jobs-list" class="grid gap-3"></div>

{% endblock %}
{% block scripts %}
<script src="{{ url_for('static', filename='js/dashboard.js') }}"></script>
{% endblock %}
